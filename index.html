<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Social Media Analytics Center</title>
<link rel="stylesheet" href="css/app.css?v=1.3.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">●</span>
    <span class="brand-text">Social Media Analytics Center</span>
  </div>
  <nav class="page-nav">
    <a href="index.html" class="nav-link active">Dashboard</a>
    <a href="input-import.html" class="nav-link">Import Data</a>
    <a href="input-manual.html" class="nav-link">Input Manual</a>
    <a href="input-pcp.html" class="nav-link">Khusus PCP</a>
    <a href="manage-periods.html" class="nav-link">Kelola Periode</a>
  </nav>
</header>

<main>
  <section class="page">
    <div class="controls-bar">
      <label>Account
        <select id="d-account"></select>
      </label>
      <label>Period
        <select id="d-period"></select>
      </label>
      <label>Compare
        <select id="d-compare"></select>
      </label>
      <button id="d-load" class="btn-primary">Lihat Analytics</button>
    </div>

    <div id="d-status" class="status-msg"></div>
    <div id="d-content" class="dashboard-grid"></div>
  </section>
</main>

<script src="js/api.js?v=1.0.2"></script>
<script src="js/common.js?v=1.1.0"></script>
<script src="js/dashboard.js?v=1.3.1"></script>
</body>
</html>
